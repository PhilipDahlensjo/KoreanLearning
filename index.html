<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Korean Quiz</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/quiz.js" defer></script>
</head>
<body>
  <main class="container">
    <!-- Menu view: shown when the page loads, lets the user pick a quiz -->
    <section id="menu-view" class="view">
      <div class="menu-header">
        <div>
          <h1>Learn Korean</h1>
          <p>Choose a quiz to start.</p>
        </div>
        <!-- Daily grammar tip: filled in by JavaScript, stays hidden if the tips cannot be loaded -->
        <aside id="daily-tip" class="daily-tip hidden">
          <p class="tip-label">Daily grammar tip</p>
          <p id="tip-title" class="tip-title"></p>
          <p id="tip-text" class="tip-text"></p>
          <div id="tip-examples" class="tip-examples"></div>
        </aside>
      </div>
      <div id="menu" class="menu"></div>
      <p id="error-message" class="error hidden"></p>
    </section>

    <!-- Quiz view: shows one question at a time -->
    <section id="quiz-view" class="view hidden">
      <div class="quiz-header">
        <button id="quit-button" class="link-button">&larr; Menu</button>
        <p id="progress" class="progress"></p>
      </div>
      <p id="prompt" class="prompt"></p>
      <p id="korean" class="korean" lang="ko"></p>
      <p id="romanization" class="romanization"></p>
      <p id="translation" class="translation"></p>
      <div id="options" class="options"></div>
      <div id="feedback" class="feedback hidden">
        <p id="feedback-text" class="feedback-text"></p>
        <p id="feedback-note" class="feedback-note"></p>
      </div>
      <button id="next-button" class="button hidden">Next</button>
    </section>

    <!-- Result view: shown when all questions are answered -->
    <section id="result-view" class="view hidden">
      <h2 id="result-title"></h2>
      <p id="score" class="score"></p>
      <p id="result-message"></p>
      <div class="button-row">
        <button id="restart-button" class="button">Try again</button>
        <button id="menu-button" class="button secondary">Back to menu</button>
      </div>
    </section>
  </main>
</body>
</html>
